<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #24292e;
      background: #fff;
    }
    .container {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      gap: 30px;
    }
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      border-right: 1px solid #e1e4e8;
      padding-right: 20px;
    }
    .sidebar h3 {
      font-size: 14px;
      color: #586069;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e1e4e8;
    }
    .sidebar ul { list-style: none; padding-left: 0; }
    .sidebar li { margin: 4px 0; }
    .sidebar a {
      color: #0366d6;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      display: block;
      padding: 2px 0;
    }
    .sidebar a:hover { text-decoration: underline; }
    .sidebar .toc-h2 { font-weight: 600; }
    .sidebar .toc-h3 { padding-left: 16px; font-weight: 400; color: #586069; }
    .sidebar .toc-h3 a { color: #586069; }
    .sidebar .toc-h3 a:hover { color: #0366d6; }
    .content {
      flex: 1;
      min-width: 0;
      max-width: 900px;
    }
    .content h1 { font-size: 28px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid #e1e4e8; }
    .content h2 { font-size: 22px; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e1e4e8; }
    .content h3 { font-size: 18px; margin: 20px 0 10px; }
    .content h4 { font-size: 16px; margin: 16px 0 8px; }
    .content p { margin: 0 0 12px; }
    .content ul, .content ol { margin: 0 0 12px; padding-left: 28px; }
    .content li { margin: 4px 0; }
    .content code { background: #f6f8fa; padding: 2px 5px; border-radius: 3px; font-size: 85%; }
    .content pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 0 0 12px; position: relative; }
    .content pre code { background: none; padding: 0; font-size: 100%; }
    .content pre .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 3px 10px;
      font-size: 12px;
      line-height: 1.5;
      background: #e1e4e8;
      border: 1px solid #d1d5da;
      border-radius: 4px;
      cursor: pointer;
      color: #24292e;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1;
    }
    .content pre:hover .copy-btn { opacity: 1; }
    .content pre .copy-btn:hover { background: #d1d5da; }
    .content pre .copy-btn.copied { background: #28a745; color: #fff; border-color: #28a745; }
    .content table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
    .content th, .content td { border: 1px solid #dfe2e5; padding: 8px 12px; text-align: left; }
    .content th { background: #f6f8fa; font-weight: 600; }
    .content img { max-width: 100%; }
    .content td img { max-width: none; }
    .content blockquote { border-left: 4px solid #dfe2e5; padding: 8px 16px; color: #586069; margin: 0 0 12px; background: #f6f8fa; }
    .content a { color: #0366d6; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content img { cursor: zoom-in; }
    .img-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s;
      cursor: zoom-out;
    }
    .img-lightbox.open { opacity: 1; visibility: visible; }
    .img-lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }
    .img-lightbox.open img { transform: scale(1); }
    .inline-toc { display: none; }
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; position: static; max-height: none; border-right: none; border-bottom: 1px solid #e1e4e8; padding-right: 0; padding-bottom: 16px; }
      .inline-toc { display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h3>目录</h3>
      <ul id="toc"></ul>
    </aside>
    <main class="content">
      {{ content }}
    </main>
  </div>
  <script>
  (function() {
    var toc = document.getElementById('toc');
    var content = document.querySelector('.content');
    var headings = content.querySelectorAll('h2, h3');
    headings.forEach(function(h) {
      if (!h.id) h.id = h.textContent.trim().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');
      var li = document.createElement('li');
      li.className = h.tagName.toLowerCase() === 'h2' ? 'toc-h2' : 'toc-h3';
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      toc.appendChild(li);
    });
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
  (function() {
    // Convert Jekyll-rendered <pre><code class="language-mermaid"> to <pre class="mermaid">
    document.querySelectorAll('code.language-mermaid').forEach(function(code) {
      var pre = code.parentElement;
      var div = document.createElement('pre');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      pre.parentElement.replaceChild(div, pre);
    });
    mermaid.initialize({startOnLoad:true, theme:'default'});
  })();
  </script>
  <script>
  (function() {
    // 给代码块添加复制按钮
    document.querySelectorAll('.content pre').forEach(function(pre) {
      if (pre.classList.contains('mermaid') || !pre.querySelector('code')) return;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = '复制';
      btn.addEventListener('click', function() {
        var code = pre.querySelector('code');
        navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(function() {
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(function() {
            btn.textContent = '复制';
            btn.classList.remove('copied');
          }, 2000);
        });
      });
      pre.appendChild(btn);
    // click picture to enlarge it（lightbox）
    var overlay = document.createElement('div');
    overlay.className = 'img-lightbox';
    var big = document.createElement('img');
    overlay.appendChild(big);
    document.body.appendChild(overlay);

    function close() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') close();
    });

    document.querySelector('.content').addEventListener('click', function(e) {
      var img = e.target.closest('img');
      if (!img || img.closest('a')) return;
      big.src = img.src;
      big.alt = img.alt || '';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  })();
  </script>
</body>
</html>
